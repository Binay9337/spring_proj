spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://localhost:3306/backend_db?createDatabaseIfNotExists=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 1200